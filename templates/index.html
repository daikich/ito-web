<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ito Web</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>
    <div class="container">
        <!-- ログイン画面 -->
        <div id="login-screen">
            <h2>ito Web に参加</h2>
            <div style="margin-bottom: 20px;">
                <label style="font-weight: bold; font-size: 0.9em; color: #555;">あなたの名前</label>
                <input type="text" id="name-input" placeholder="例: 太郎">
            </div>
            <div style="margin-bottom: 20px;">
                <label style="font-weight: bold; font-size: 0.9em; color: #555;">合言葉（ルーム名）</label>
                <div style="display: flex; gap: 10px;">
                    <input type="text" id="room-input" placeholder="例: secret777" style="flex: 1; margin: 0;">
                    <button onclick="generateRandomRoom()"
                        style="width: auto; padding: 12px; background-color: #ff9800; font-size: 0.9em; white-space: nowrap;">自動生成</button>
                </div>
                <p style="font-size: 0.8em; color: #777; margin-top: 5px;">※友達と同じ合言葉を入力すると同じ部屋に入れます。</p>
            </div>
            <button onclick="joinRoom()" style="padding: 15px; font-size: 1.2em;">この合言葉で入室する</button>
            <a href="https://github.com/daikich/ito-web.git" target="_blank" rel="noopener noreferrer">ソースコード</a>
        </div>

        <!-- ゲーム画面 -->
        <div id="game-screen">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
                <h3 id="room-display" style="margin: 0;"></h3>
                <button id="end-game-btn" onclick="endGame()"
                    style="display: none; background-color: #f44336; padding: 8px 15px; width: auto; font-size: 0.9em; margin: 0;">ゲーム終了</button>
            </div>

            <p style="margin-top: 0;"><strong>参加者:</strong> <span id="players-display"></span></p>
            <hr>

            <div id="game-controls"
                style="background-color: #f5f5f5; padding: 15px; border-radius: 8px; margin-bottom: 20px;">

                <div style="display: flex; gap: 10px; margin-bottom: 15px;">
                    <button onclick="leaveRoom()" style="background-color: #9e9e9e; padding: 10px; font-size: 0.9em;">🚪
                        退出する</button>
                    <button onclick="disbandRoom()"
                        style="background-color: #e91e63; padding: 10px; font-size: 0.9em;">💣 ルーム解散</button>
                </div>

                <div class="mode-select-area">
                    <label>
                        <input type="radio" name="game-mode" value="normal" checked>
                        <strong>通常モード</strong>
                        <span class="mode-desc">クリアするごとに手札が1枚ずつ増える</span>
                    </label>
                    <label>
                        <input type="radio" name="game-mode" value="single">
                        <strong>ずっと1枚モード</strong>
                        <span class="mode-desc">何度やっても手札は1枚だけ</span>
                    </label>
                </div>
                <button id="start-btn" onclick="startGame()">ゲーム開始！</button>
            </div>

            <div id="theme-area" class="theme-box" style="display: none;">
                お題：<span id="theme-display"></span>
            </div>

            <div id="my-cards-container"></div>
            <hr>

            <div>
                <h3>場に出たカード</h3>
                <div id="played-cards-area">まだ誰も出していません</div>
            </div>

            <!-- 全員出し終わった時のエリア -->
            <div id="next-game-area" style="display: none; margin-top: 20px; text-align: center;">
                <h3 id="all-played-msg" style="color: #e91e63; margin-bottom: 15px;">全員がカードを出しました！</h3>

                <!-- 結果を見るボタン -->
                <button id="reveal-btn" onclick="revealCards()"
                    style="background-color: #ff9800; padding: 15px; font-size: 1.1em; margin-bottom: 10px;">結果を見る！</button>

                <!-- 次のゲームへ進むボタン（最初は隠しておく） -->
                <button id="next-btn" onclick="startGame()"
                    style="background-color: #4caf50; padding: 15px; font-size: 1.1em; display: none;">次のゲームへ進む</button>
            </div>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/game.js') }}"></script>
</body>

</html>
